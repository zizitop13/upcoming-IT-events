name: Retire GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Replace the old app with the Firebase migration redirect
        run: |
          mkdir -p "$RUNNER_TEMP/pages-redirect"
          cat > "$RUNNER_TEMP/pages-redirect/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://upcoming-it-events.web.app/"><title>Upcoming IT Events has moved</title></head><body><p>Upcoming IT Events is now hosted on <a href="https://upcoming-it-events.web.app/">Firebase Hosting</a>.</p></body></html>
          HTML
          cp "$RUNNER_TEMP/pages-redirect/index.html" "$RUNNER_TEMP/pages-redirect/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-redirect
      - name: Retire the old Pages app
        id: deployment
        uses: actions/deploy-pages@v4
