# Generated from the private catalogue validator. No Node.js or website source is required.
name: Validate events and links
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recheck:
        description: Recheck previously successful links
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validate-catalogue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .cache/checked-links.json
          key: checked-links-v3-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            checked-links-v3-${{ github.ref }}-
            checked-links-v3-refs/heads/main-
            checked-links-v2-refs/heads/main-
      - name: Validate Markdown, event identity and links
        env:
          RECHECK: ${{ inputs.recheck || 'false' }}
        run: |
          python - <<'PY'
          """Source of the inline, dependency-free public Markdown validation workflow."""

          from concurrent.futures import ThreadPoolExecutor
          from datetime import date, datetime, timezone
          import hashlib
          import html
          from html.parser import HTMLParser
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import socket
          import subprocess
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request

          COLUMNS = ['Name', 'Starts', 'Ends', 'Location', 'Format', 'Main deadline',
                     'Pre-submit project', 'Project deadline', 'Cost', 'Description', 'Website']
          TABLE = re.compile(r'content/(conferences|hackathons)/(\d{4})\.md\Z')
          DETAIL = re.compile(r'content/details/(conferences|hackathons)/\d{4}/[a-z0-9][a-z0-9-]*\.md\Z')


          def prose(text):
              text = re.sub(r'^(`{3,}|~{3,})[^\n]*\n.*?^\1\s*$', '', text, flags=re.M | re.S)
              return re.sub(r'(`+).*?\1', '', text, flags=re.S)


          def normalized(text):
              return re.sub(r'[^a-z0-9]+', ' ', unicodedata.normalize('NFKD', text).lower()).strip()


          def cells(line):
              return [part.strip() for part in line.strip().strip('|').split('|')]


          def markdown_link(value):
              match = re.fullmatch(r'\[([^\]]+)\]\(([^)]+)\)', value.strip())
              return (match[1], match[2]) if match else (value.strip(), None)


          def valid_date(value):
              try:
                  return bool(re.fullmatch(r'\d{4}-\d{2}-\d{2}', value)) and date.fromisoformat(value).isoformat() == value
              except ValueError:
                  return False


          def web_url(value):
              try:
                  parsed = urllib.parse.urlsplit(value)
                  return parsed.scheme in ('http', 'https') and bool(parsed.hostname) and not parsed.username and not parsed.password
              except ValueError:
                  return False


          def structure(root, paths):
              failures, events, links, seen = [], [], {}, {}
              for name in paths:
                  path = root / name
                  if path.is_symlink():
                      failures.append(f'{name}: symlinks are not permitted')
                      continue
                  if not (name.endswith('.md') or re.fullmatch(r'\.github/workflows/[^/]+\.ya?ml', name)):
                      failures.append(f'{name}: this public repository permits Markdown and validation workflows only')
                      continue
                  if not name.endswith('.md'):
                      continue
                  if path.stat().st_size > 1_000_000:
                      failures.append(f'{name}: Markdown file exceeds 1 MB')
                      continue
                  raw = path.read_text(encoding='utf-8')
                  text = prose(raw)
                  for url in re.findall(r'https?://[^\s<>"\x27)|]+', text):
                      links.setdefault(html.unescape(url.rstrip('.,;')), set()).add(name)
                  for target in re.findall(r'\]\(([^\s)]+)\)', text):
                      if target.startswith(('http:', 'https:', 'mailto:', '#')):
                          continue
                      if ':' in target or target.startswith('//'):
                          failures.append(f'{name}: unsupported link scheme {target}')
                          continue
                      target_path = (path.parent / urllib.parse.unquote(target.split('#')[0])).resolve()
                      if not target_path.is_relative_to(root.resolve()) or not target_path.exists():
                          failures.append(f'{name}: missing or out-of-repository local link {target}')
                  if not name.startswith('content/'):
                      continue
                  match = TABLE.fullmatch(name)
                  if not match and not DETAIL.fullmatch(name):
                      failures.append(f'{name}: unsupported content path')
                      continue
                  if re.match(r'^---(?:\n|$)', raw) or re.search(r'<\/?[a-z][^>]*>', raw, re.I):
                      failures.append(f'{name}: plain Markdown only; no frontmatter or HTML')
                  if not match:
                      if not re.search(r'^# .+', raw, re.M):
                          failures.append(f'{name}: detail page needs a heading')
                      continue
                  lines = text.splitlines()
                  headers = [index for index, line in enumerate(lines) if line.strip().startswith('|') and cells(line) == COLUMNS]
                  if len(headers) != 1:
                      failures.append(f'{name}: exactly one canonical 11-column table is required')
                      continue
                  header = headers[0]
                  separator = cells(lines[header + 1]) if header + 1 < len(lines) else []
                  if len(separator) != len(COLUMNS) or any(not re.fullmatch(r':?-{3,}:?', item) for item in separator):
                      failures.append(f'{name}: invalid Markdown table separator')
                  for index, line in enumerate(lines[header + 2:], header + 3):
                      if not line.strip().startswith('|'):
                          continue
                      values = cells(line)
                      source = f'{name}:{index}'
                      if len(values) != len(COLUMNS):
                          failures.append(f'{source}: expected 11 cells, found {len(values)}')
                          continue
                      row = dict(zip(COLUMNS, values))
                      event_name, detail = markdown_link(row['Name'])
                      if any(not value for value in values) or event_name == '-':
                          failures.append(f'{source}: missing a required value')
                      for field in ('Starts', 'Ends', 'Main deadline', 'Project deadline'):
                          value = row[field]
                          if value == '-' and field not in ('Starts', 'Ends'):
                              continue
                          if not valid_date(value):
                              failures.append(f'{source}: invalid {field} date {value}')
                      if row['Starts'][:4] != match[2]:
                          failures.append(f'{source}: start year does not match the file year')
                      if row['Ends'] < row['Starts']:
                          failures.append(f'{source}: event ends before it starts')
                      if row['Format'] not in ('On-site', 'Online', 'Hybrid'):
                          failures.append(f'{source}: invalid Format')
                      if row['Pre-submit project'] not in ('Yes', 'No'):
                          failures.append(f'{source}: Pre-submit project must be Yes or No')
                      if row['Pre-submit project'] == 'No' and row['Project deadline'] != '-':
                          failures.append(f'{source}: Project deadline must be - when no submission is needed')
                      website = markdown_link(row['Website'])[1] or row['Website']
                      if not web_url(website):
                          failures.append(f'{source}: invalid official Website URL')
                      if detail:
                          resolved = (path.parent / urllib.parse.unquote(detail)).resolve()
                          if not resolved.is_relative_to(root.resolve()) or not DETAIL.fullmatch(resolved.relative_to(root.resolve()).as_posix()):
                              failures.append(f'{source}: event name must link to a local Markdown detail page')
                      key = normalized(event_name) + '::' + row['Starts'][:4]
                      if key in seen:
                          failures.append(f'{source}: duplicate event {key}; first in {seen[key]}')
                      seen[key] = source
                      events.append({'name': event_name, 'description': row['Description'], 'website': website, 'source': source})
              if not events:
                  failures.append('The catalogue has no events')
              return failures, events, links


          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts, self.skip = [], 0

              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ('script', 'style'):
                      self.skip = max(0, self.skip - 1)

              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)


          def matches_event(body, name):
              parser = Text()
              parser.feed(body)
              text = normalized(' '.join(parser.parts))
              words = [word for word in normalized(name).split() if len(word) > 2 and not word.isdecimal()
                       and word not in ('the', 'conference', 'hackathon', 'online', 'europe')]
              return bool(words) and all(word in text for word in words)


          def public_url(url):
              if not web_url(url):
                  raise ValueError('Only HTTP(S) URLs without embedded credentials are permitted')
              host = urllib.parse.urlsplit(url).hostname
              addresses = socket.getaddrinfo(host, None, type=socket.SOCK_STREAM)
              if not addresses or any(not ipaddress.ip_address(item[4][0]).is_global for item in addresses):
                  raise ValueError('Local or private network destinations are not permitted')


          class PublicRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  public_url(new_url)
                  return super().redirect_request(request, fp, code, message, headers, new_url)


          def check_url(item):
              url, sources, associated = item
              result = {'url': url, 'sources': sorted(sources), 'events': associated}
              try:
                  public_url(url)
                  opener = urllib.request.build_opener(PublicRedirect())
                  request = urllib.request.Request(url, headers={'User-Agent': 'UpcomingITEvents-LinkChecker/2.0'})
                  with opener.open(request, timeout=20) as response:
                      body = response.read(2_000_000).decode(response.headers.get_content_charset() or 'utf-8', errors='replace') if associated else ''
                      for event in associated:
                          if not matches_event(body, event['name']):
                              raise ValueError(f"Event identity not confirmed: {event['name']}; manual review needed")
                      return {**result, 'status': 'passed', 'finalUrl': response.url, 'checkedAt': datetime.now(timezone.utc).isoformat()}
              except urllib.error.HTTPError as error:
                  status = 'unverified' if error.code in (401, 403, 429) else 'failed'
                  return {**result, 'status': status, 'reason': f'HTTP {error.code}; manual verification required'}
              except Exception as error:
                  return {**result, 'status': 'failed', 'reason': str(error)}


          def annotation(level, value):
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level}::{escaped}')


          def verified_cached(cache, key, url, names):
              if key in cache:
                  return True
              # Preserve verified destinations from the former JavaScript checker cache.
              for entry in list(cache.values()):
                  if isinstance(entry, dict) and entry.get('url') == url and entry.get('names') == names:
                      cache[key] = entry
                      return True
              return False


          def main():
              root = Path.cwd()
              tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              failures, events, links = structure(root, [name for name in tracked if name])
              cache_file = root / '.cache/checked-links.json'
              try:
                  cache = json.loads(cache_file.read_text())
                  if not isinstance(cache, dict):
                      cache = {}
              except (OSError, ValueError):
                  cache = {}
              tasks, report, keys = [], [], {}
              for url, sources in sorted(links.items()):
                  associated = [{key: event[key] for key in ('name', 'description', 'source')} for event in events if event['website'] == url]
                  if any(symbol in url for symbol in '{}$') or 'example.' in url:
                      report.append({'url': url, 'status': 'template skipped'})
                      continue
                  key = hashlib.sha256(json.dumps([3, url, sorted(event['name'] for event in associated)]).encode()).hexdigest()
                  keys[url] = key
                  if os.environ.get('RECHECK') != 'true' and verified_cached(cache, key, url, sorted(event['name'] for event in associated)):
                      report.append({'url': url, 'status': 'cached'})
                  else:
                      tasks.append((url, sources, associated))
              with ThreadPoolExecutor(max_workers=6) as pool:
                  for result in pool.map(check_url, tasks):
                      report.append(result)
                      if result['status'] == 'passed':
                          cache[keys[result['url']]] = result
                      elif result['status'] == 'failed':
                          failures.append(f"{result['url']}: {result['reason']}")
                      else:
                          annotation('warning', f"{result['url']}: {result['reason']}")
              cache_file.parent.mkdir(exist_ok=True)
              cache_file.write_text(json.dumps(cache, indent=2) + '\n')
              (root / 'link-check-report.json').write_text(json.dumps({'events': len(events), 'failures': failures, 'report': report}, indent=2) + '\n')
              for failure in failures:
                  annotation('error', failure)
              summary = f"{len(events)} events; {len(links)} URLs; {sum(item['status'] == 'cached' for item in report)} cached; {len(failures)} failures"
              print(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                      stream.write(summary + '\n\nSee the `link-check-report` artifact for URLs, event descriptions and manual-review reasons.\n')
              raise SystemExit(1 if failures else 0)


          if __name__ == '__main__':
              main()

          PY
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('.cache/checked-links.json') != ''
        with:
          path: .cache/checked-links.json
          key: checked-links-v3-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-check-report
          path: link-check-report.json
          retention-days: 14
